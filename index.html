<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBX 3D 뷰어</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f5f7;color:#1d2330}
#app{display:flex;height:100%}
#side{width:310px;flex:none;background:#fff;border-right:1px solid #e1e4ea;display:flex;flex-direction:column;min-height:0}
#side h1{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid #e1e4ea}
#drop{display:block;margin:10px;padding:16px 10px;border:2px dashed #b8cdfa;border-radius:10px;text-align:center;cursor:pointer;background:#f7f9ff}
#drop.over{background:#e9f0ff;border-color:#4a7cf0}#drop input{display:none}
#drop b{display:block;font-size:14px;color:#2453c6}#drop span{font-size:11px;color:#667085}
#list{flex:1;overflow:auto;padding:0 6px 6px;min-height:0}
.it{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;user-select:none}
.it:hover{background:#f2f4f8}.it.on{background:#e9f0ff;border-color:#b8cdfa}
.it b{display:block;font-size:13px;word-break:break-all}.it small{display:block;font-size:11px;color:#667085;margin-top:2px}
.x{float:right;color:#98a2b3;font-size:12px;padding:0 4px}.x:hover{color:#c5221f}
.st{font-size:11px;margin-top:3px}.ok{color:#137333}.er{color:#c5221f}
#opts{padding:10px 14px;border-top:1px solid #e1e4ea;font-size:12px;display:grid;gap:6px}
#opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
button,select{font:inherit;font-size:12px;padding:5px 8px;border:1px solid #c9ced8;background:#fff;border-radius:6px;cursor:pointer}
button:hover{background:#f2f4f8}
#main{flex:1;position:relative;min-width:0}
#c{width:100%;height:100%;display:block}
#info{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.95);border:1px solid #e1e4ea;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7;max-width:380px}
#info b{font-size:14px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:15px;pointer-events:none}
#hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:#667085}
#views{position:absolute;right:12px;top:12px;display:flex;gap:4px}
@media (max-width:700px){#app{flex-direction:column}#side{width:100%;height:45%}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="app">
 <div id="side"><h1>FBX 3D 뷰어</h1>
  <label id="drop"><input type="file" id="file" multiple accept=".fbx,.obj,.stl,.glb"><b>FBX 파일 올리기</b><span>클릭하거나 여기로 끌어다 놓기<br>(여러 개 가능 · FBX 바이너리/텍스트 · OBJ · STL · GLB)</span></label>
  <div id="list"></div>
  <div id="opts">
   <label><input type="checkbox" id="wire"> 와이어프레임</label>
   <label><input type="checkbox" id="edges" checked> 모서리선 표시</label>
   <label><input type="checkbox" id="mono"> 단색 재질(원본 재질 무시)</label>
   <button id="all">전체 나란히 보기</button>
  </div></div>
 <div id="main"><canvas id="c"></canvas>
  <div id="info" style="display:none"></div><div id="empty">왼쪽에서 FBX 파일을 올려주세요</div>
  <div id="views"><button data-v="iso">3D</button><button data-v="front">정면</button><button data-v="top">평면</button><button data-v="right">우측</button></div>
  <div id="hint">왼쪽 드래그: 회전 · 오른쪽 드래그: 이동 · 휠: 확대</div></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {unzipSync} from 'three/addons/libs/fflate.module.js';

// 장면 단위 = m, 위쪽 = +Z
const UNITS={mm:1,cm:10,m:1000,ft:304.8,in:25.4};
const $=id=>document.getElementById(id);
const cv=$('c'),info=$('info'),empty=$('empty'),list=$('list'),wire=$('wire'),edges=$('edges'),mono=$('mono');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f5f7);
const cam=new THREE.PerspectiveCamera(40,1,0.001,1000);cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,1.6));
const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(5,-8,10);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,.6);dl2.position.set(-6,6,4);scene.add(dl2);
let grid=null;const root=new THREE.Group();scene.add(root);
const monoMat=new THREE.MeshStandardMaterial({color:0xc8ccd4,roughness:.6,metalness:.1,side:THREE.DoubleSide});
const DATA=[];let current=-1;

// ---------- FBX 헤더 정보 (축/단위) ----------
function fbxMeta(buf){
 const u8=new Uint8Array(buf);const isBin=new TextDecoder('latin1').decode(u8.slice(0,18))==='Kaydara FBX Binary';
 const m={binary:isBin,upAxis:null,unitScale:null,creator:false};
 if(!isBin){const t=new TextDecoder().decode(u8);
  const a=t.match(/"UpAxis"\s*,\s*"int"\s*,\s*"Integer"\s*,\s*"[^"]*"\s*,\s*(-?\d+)/);if(a)m.upAxis=+a[1];
  const s=t.match(/"UnitScaleFactor"\s*,\s*"double"\s*,\s*"Number"\s*,\s*"[^"]*"\s*,\s*([-\d.eE+]+)/);if(s)m.unitScale=+s[1];
  m.creator=/^\s*Creator\s*:/m.test(t.slice(0,5000));m.text=t;return m}
 const dv=new DataView(buf);
 const find=k=>{const kb=new TextEncoder().encode(k);outer:for(let i=0;i<Math.min(u8.length,400000)-kb.length;i++){for(let j=0;j<kb.length;j++)if(u8[i+j]!==kb[j])continue outer;return i+kb.length}return -1};
 const val=k=>{let p=find(k);if(p<0)return null;for(let n=0;n<6&&p<u8.length;n++){const c=String.fromCharCode(u8[p]);p++;
  if(c==='S'||c==='R'){p+=4+dv.getUint32(p,true)}else if(c==='I')return dv.getInt32(p,true);else if(c==='D')return dv.getFloat64(p,true);else if(c==='F')return dv.getFloat32(p,true);else return null}return null};
 m.upAxis=val('UpAxis');m.unitScale=val('UnitScaleFactor');m.creator=find('Creator')>=0;return m}

// 텍스트 FBX의 한 줄 블록 "X: .. { k: v, k2: v2 }" 를 여러 줄로 펼침 (three.js 파서 호환)
function normalizeAsciiFBX(text){
 const out=[];
 const splitTop=s=>{const parts=[];let q=false,cur='';for(const ch of s){if(ch=='"')q=!q;if(ch==','&&!q){parts.push(cur);cur=''}else cur+=ch}parts.push(cur);return parts.map(p=>p.trim()).filter(Boolean)};
 for(const line of text.split(/\r?\n/)){
  const m=line.match(/^(\s*)([^{}"]*?(?:"[^"]*"[^{}"]*?)*)\{(.*)\}\s*$/);
  if(m&&m[3].trim()!==''){const ind=m[1],head=m[2].trimEnd(),body=m[3].trim();
   out.push(ind+head+(head.endsWith(':')?'  {':' {'));
   if(/^a\s*:/.test(body))out.push(ind+'\t'+body);else for(const p of splitTop(body))out.push(ind+'\t'+p);
   out.push(ind+'}')}
  else if(/^\s*P\s*:/.test(line))out.push(line.replace(/,\s+(?=[-+.\d])/g,','));  // P: 값의 쉼표 뒤 공백 제거
  else out.push(line)}
 return out.join('\n')}

// Revit FBX: 재질이 표준 Material 대신 "ProxyObject_<재질명>" + ADSKAssetReferences(ZIP) 로 저장됨
// -> ZIP 안 AssetData/InstanceProperties.bin 에서 generic_diffuse(RGBA double) 를 읽어 모델별 색 배열을 만든다.
function readRevitMaterials(buf, unzipSync) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  if (new TextDecoder('latin1').decode(u8.slice(0, 18)) !== 'Kaydara FBX Binary') return null;
  const ver = dv.getUint32(23, true), big = ver >= 7500, td = new TextDecoder();
  const objects = new Map();          // id -> {name, assetId}
  const conns = [];                   // [child, parent]
  const blobs = [];
  function node(off, path) {
    let end, np, pl;
    if (big) { end = Number(dv.getBigUint64(off, true)); np = Number(dv.getBigUint64(off + 8, true)); pl = Number(dv.getBigUint64(off + 16, true)); off += 24; }
    else { end = dv.getUint32(off, true); np = dv.getUint32(off + 4, true); pl = dv.getUint32(off + 8, true); off += 12; }
    if (end === 0) return 0;
    const nl = u8[off]; const name = td.decode(u8.subarray(off + 1, off + 1 + nl)); off += 1 + nl;
    const props = []; let p = off;
    for (let i = 0; i < np; i++) {
      const t = String.fromCharCode(u8[p]); p++;
      if (t === 'S' || t === 'R') { const l = dv.getUint32(p, true); const v = u8.subarray(p + 4, p + 4 + l); props.push(t === 'S' ? td.decode(v) : v); p += 4 + l; }
      else if (t === 'Y') { props.push(dv.getInt16(p, true)); p += 2; }
      else if (t === 'C') { props.push(u8[p]); p += 1; }
      else if (t === 'I') { props.push(dv.getInt32(p, true)); p += 4; }
      else if (t === 'F') { props.push(dv.getFloat32(p, true)); p += 4; }
      else if (t === 'D') { props.push(dv.getFloat64(p, true)); p += 8; }
      else if (t === 'L') { props.push(Number(dv.getBigInt64(p, true))); p += 8; }
      else { const cl = dv.getUint32(p + 8, true); props.push(null); p += 12 + cl; }
    }
    off += pl;
    const here = path + '/' + name, kids = [];
    while (off < end) { const r = node(off, here); if (!r) { off += big ? 25 : 13; break; } kids.push(r.n); off = r.end; }
    const n = { name, props, kids };
    if (here === '/Objects/Object') {
      const nm = String(props[1] || '').split('\u0000')[0];
      let assetId = null;
      for (const k of kids) if (k.name === 'Properties70') for (const pp of k.kids) {
        if (pp.props[0] === 'ADSKAssetReferenceID') assetId = pp.props[4];
        if (typeof pp.props[0] === 'string' && pp.props[0].startsWith('ADSKAssetReferencesBlob'))
          for (const bd of pp.kids) if (bd.name === 'BinaryData' && bd.props[0] instanceof Uint8Array) blobs.push(bd.props[0]);
      }
      objects.set(props[0], { name: nm, assetId });
    }
    if (here === '/Connections/C' && props[0] === 'OO') conns.push([props[1], props[2]]);
    return { n, end };
  }
  let off = 27;
  while (off < u8.length - 160) { const r = node(off, ''); if (!r) break; off = r.end; }

  // 자산 GUID -> 확산색
  const colors = new Map();
  const guidRe = /[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}/g;
  for (const blob of blobs) {
    let files; try { files = unzipSync(blob); } catch (e) { continue; }
    for (const [fn, data] of Object.entries(files)) {
      if (!fn.endsWith('AssetData/InstanceProperties.bin')) continue;
      const s = new TextDecoder('latin1').decode(data), d = new DataView(data.buffer, data.byteOffset, data.byteLength);
      const marks = []; let m; guidRe.lastIndex = 0;
      while ((m = guidRe.exec(s))) if (s.slice(Math.max(0, m.index - 20), m.index).includes('GenericSchema')) marks.push([m.index, m[0]]);
      marks.forEach(([st, gid], i) => {
        const en = i + 1 < marks.length ? marks[i + 1][0] : data.length;
        for (let o = st; o + 32 <= en; o++) {
          const r = d.getFloat64(o, true), g = d.getFloat64(o + 8, true), b = d.getFloat64(o + 16, true), a = d.getFloat64(o + 24, true);
          if ([r, g, b].every(x => x >= 0 && x <= 1) && Math.abs(a - 1) < 1e-9 && (r + g + b) > 0.003) { colors.set(gid, [r, g, b]); break; }
        }
      });
    }
  }
  // 모델 id -> 연결 순서대로의 [재질명, 색]
  const byModel = new Map();
  for (const [child, parent] of conns) {
    const o = objects.get(child); if (!o || !o.assetId || !o.name.startsWith('ProxyObject_')) continue;
    if (!byModel.has(parent)) byModel.set(parent, []);
    byModel.get(parent).push({ name: o.name.replace('ProxyObject_', '') || '(이름 없음)', color: colors.get(o.assetId) || null });
  }
  return { byModel, materialCount: [...objects.values()].filter(o => o.name.startsWith('ProxyObject_')).length, colorCount: colors.size };
}

// Revit 재질 색을 메쉬에 적용
function applyRevitColors(obj,rm){
 let n=0,gray=0;const cache=new Map();
 const mk=m=>{const k=m.name;if(cache.has(k))return cache.get(k);const c=new THREE.Color();const isGray=m.color&&m.color.every(v=>Math.abs(v-0.315)<0.002);
  if(m.color&&!isGray)c.setRGB(m.color[0],m.color[1],m.color[2],THREE.SRGBColorSpace);else c.set(0xc8ccd4);  // Revit 기본 회색(0.315)은 밝은 회색으로
  if(isGray)gray++;const mat=new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05,name:m.name});cache.set(k,mat);return mat};
 obj.traverse(x=>{if(!x.isMesh)return;const list=rm.byModel.get(x.ID);if(!list||!list.length)return;
  const mats=list.map(mk);x.material=x.geometry.groups.length?mats:mats[0];n++});
 return {meshes:n,materials:cache.size,allGray:cache.size>0&&gray===cache.size}}

// ---------- 파일 읽기 ----------
async function parse(file){
 const ext=file.name.split('.').pop().toLowerCase(),buf=await file.arrayBuffer();
 if(ext==='fbx'){const meta=fbxMeta(buf);let src=buf,note=[];
  if(!meta.binary){const fixed=normalizeAsciiFBX(meta.text);if(fixed!==meta.text)note.push('한 줄 블록 자동 보정');src=new TextEncoder().encode(fixed).buffer}
  const obj=new FBXLoader().parse(src,'');
  {const lv=[];obj.traverse(x=>{if(x.isMesh&&/^(레벨|Level)_/.test(x.name))lv.push(x)});lv.forEach(x=>x.parent.remove(x));if(lv.length)note.push(`레벨 표식 ${lv.length}개 숨김`)}
  if(meta.binary){try{const rm=readRevitMaterials(buf,unzipSync);
   if(rm&&rm.byModel.size){const r=applyRevitColors(obj,rm);
    if(r.materials)note.push(r.allGray?`Revit 재질 ${r.materials}개(모양 색이 모두 기본 회색)`:`Revit 재질 ${r.materials}개 색 적용`)}}catch(e){note.push('Revit 재질 읽기 실패')}}
  let unit='mm',why='';
  if(meta.unitScale&&!(meta.unitScale===1&&!meta.creator)){const mmpu=meta.unitScale*10;
   unit=Object.keys(UNITS).find(k=>Math.abs(UNITS[k]-mmpu)<1e-6*mmpu)||'mm';why=`파일 설정(UnitScaleFactor ${meta.unitScale})`;
   if(!Object.keys(UNITS).some(k=>Math.abs(UNITS[k]-mmpu)<1e-6*mmpu)){unit='custom';UNITS.custom=mmpu}}
  else why='파일 단위 정보 없음 → mm로 추정';
  return {obj,up:meta.upAxis===1?'Y':'Z',unit,why,fmt:(meta.binary?'FBX 바이너리':'FBX 텍스트')+(note.length?' · '+note.join(', '):'')}}
 if(ext==='obj')return {obj:new OBJLoader().parse(new TextDecoder().decode(buf)),up:'Y',unit:'mm',why:'OBJ → mm로 가정',fmt:'OBJ'};
 if(ext==='stl'){const g=new STLLoader().parse(buf);return {obj:new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xc8ccd4})),up:'Z',unit:'mm',why:'STL → mm로 가정',fmt:'STL'}}
 if(ext==='glb'){const r=await new Promise((a,b)=>new GLTFLoader().parse(buf,'',a,b));return {obj:r.scene,up:'Y',unit:'m',why:'glTF 표준(m)',fmt:'GLB'}}
 throw new Error('지원하지 않는 형식: .'+ext)}

function prepare(d){
 const o=d.obj;let m=0,t=0;
 o.traverse(x=>{if(x.isCamera||x.isLight)x.visible=false;
  if(x.isMesh){m++;const g=x.geometry;t+=(g.index?g.index.count:g.attributes.position.count)/3;x.userData.orig=x.material;
   const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,25),new THREE.LineBasicMaterial({color:0x2b3240,transparent:true,opacity:.55}));e.userData.edge=1;x.add(e)}});
 d.meshes=m;d.tris=Math.round(t);
 d.wrap=new THREE.Group();d.wrap.add(o);
 if(d.up==='Y')o.rotation.x=Math.PI/2;   // Y-up → Z-up
 applyUnit(d)}
function applyUnit(d){const s=UNITS[d.unit]/1000;d.obj.scale.setScalar(s);d.obj.updateMatrixWorld(true);
 d.size=new THREE.Box3().setFromObject(d.wrap).getSize(new THREE.Vector3())}
const fmt=s=>[s.x,s.y,s.z].map(v=>Math.round(v*1000).toLocaleString()).join(' × ')+' mm';

// ---------- 표시 ----------
function applyOpts(){const w=wire.checked,e=edges.checked,mo=mono.checked;
 root.traverse(x=>{if(x.isMesh){x.material=mo?monoMat:x.userData.orig;(Array.isArray(x.material)?x.material:[x.material]).forEach(m=>{m.wireframe=w;m.side=THREE.DoubleSide})}if(x.userData.edge)x.visible=e})}
function fit(view='iso'){const bb=new THREE.Box3().setFromObject(root);if(bb.isEmpty())return;
 const c=bb.getCenter(new THREE.Vector3()),r=Math.max(bb.getSize(new THREE.Vector3()).length()/2,1e-3);
 const dir={iso:[1,-1.3,.9],front:[0,-1,0],top:[0,-0.001,1],right:[1,0,0]}[view];
 cam.position.copy(c).add(new THREE.Vector3(...dir).normalize().multiplyScalar(r/Math.sin(THREE.MathUtils.degToRad(20))*1.05));
 cam.near=r/200;cam.far=r*200;cam.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 if(grid)scene.remove(grid);grid=new THREE.GridHelper(Math.max(r*4,0.5),20,0xb5bac4,0xdde0e6);grid.rotation.x=Math.PI/2;grid.position.set(c.x,c.y,bb.min.z-r*0.001);scene.add(grid)}
function unitSelect(d){const opts=['mm','cm','m','ft','in'].concat(d.unit==='custom'?['custom']:[]);
 return `<select id="unitSel">${opts.map(u=>`<option ${u===d.unit?'selected':''}>${u}</option>`).join('')}</select>`}
function show(i){current=i;root.clear();renderSel();
 const d=DATA[i];empty.style.display='none';info.style.display='block';
 if(!d.ok){info.innerHTML=`<b>${d.name}</b><br><span class="er">불러오기 실패: ${d.err}</span>`;return}
 d.wrap.position.set(0,0,0);root.add(d.wrap);applyOpts();fit();
 info.innerHTML=`<b>${d.name}</b><br>외형(W×D×H): <b>${fmt(d.size)}</b><br>${d.fmt} · 위쪽 축 ${d.up}<br>파일 단위 ${unitSelect(d)} <small style="color:#667085">${d.why}${d.unit==='ft'?' · Revit 기본 저장 단위':''} → 치수는 mm로 환산 표시</small><br>메쉬 ${d.meshes}개 · 삼각형 ${d.tris.toLocaleString()}개`;
 $('unitSel').onchange=e=>{d.unit=e.target.value;d.why='직접 지정';applyUnit(d);renderList();show(i)}}
function showAll(){current=-1;root.clear();renderSel();let x=0,ok=0;const gap=0.3;
 DATA.forEach(d=>{if(!d.ok)return;ok++;d.wrap.position.set(0,0,0);d.wrap.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(d.wrap);
  d.wrap.position.set(x-bb.min.x,-(bb.min.y+bb.max.y)/2,-bb.min.z);x+=(bb.max.x-bb.min.x)+gap;root.add(d.wrap)});
 applyOpts();fit();empty.style.display='none';info.style.display='block';info.innerHTML=`<b>전체 ${ok}/${DATA.length}개 표시</b><br>실제 크기 비율 그대로 나란히 배치`}
function renderSel(){[...list.children].forEach((el,k)=>el.classList.toggle('on',k===current))}
function renderList(){list.innerHTML='';
 DATA.forEach((d,i)=>{const el=document.createElement('div');el.className='it';
  el.innerHTML=`<span class="x" title="목록에서 빼기">✕</span><b>${i+1}. ${d.name}</b><small>${(d.bytes/1024).toFixed(0)} KB${d.ok?' · '+d.fmt:''}</small><div class="st ${d.ok?'ok':'er'}">${d.ok?'✔ 정상 · '+fmt(d.size):'✖ 실패: '+d.err}</div>`;
  el.onclick=()=>show(i);
  el.querySelector('.x').onclick=e=>{e.stopPropagation();DATA.splice(i,1);renderList();
   if(DATA.length)show(Math.min(i,DATA.length-1));else{root.clear();info.style.display='none';empty.style.display='flex'}};
  list.appendChild(el)});renderSel()}
async function addFiles(files){const start=DATA.length;
 for(const f of files){const d={name:f.name,bytes:f.size};
  try{Object.assign(d,await parse(f));prepare(d);d.ok=true}catch(e){d.ok=false;d.err=String(e.message||e)}
  DATA.push(d)}
 renderList();if(DATA.length>start)show(start)}

$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const drop=$('drop');
['dragover','dragenter'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
addEventListener('drop',e=>{if(e.dataTransfer?.files?.length)addFiles([...e.dataTransfer.files])});
[wire,edges,mono].forEach(e=>e.onchange=applyOpts);
$('all').onclick=()=>{if(DATA.length)showAll()};
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>fit(b.dataset.v));
function resize(){const p=cv.parentElement;R.setSize(p.clientWidth,p.clientHeight,false);cam.aspect=p.clientWidth/p.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam)})();
</script></body></html>
