<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBX 3D 뷰어</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f5f7;color:#1d2330}
#app{display:flex;height:100%}
#side{width:300px;flex:none;background:#fff;border-right:1px solid #e1e4ea;display:flex;flex-direction:column}
#side h1{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid #e1e4ea}
#list{flex:1;overflow:auto;padding:6px}
.it{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.it:hover{background:#f2f4f8}.it.on{background:#e9f0ff;border-color:#b8cdfa}
.it b{display:block;font-size:13px}.it small{display:block;font-size:11px;color:#667085;margin-top:2px}
.st{font-size:11px;margin-top:3px}.ok{color:#137333}.er{color:#c5221f}
#drop{display:block;margin:10px;padding:16px 10px;border:2px dashed #b8cdfa;border-radius:10px;text-align:center;cursor:pointer;background:#f7f9ff}#drop.over{background:#e9f0ff;border-color:#4a7cf0}#drop input{display:none}#drop b{display:block;font-size:14px;color:#2453c6}#drop span{font-size:11px;color:#667085}.x{float:right;color:#98a2b3;font-size:12px;padding:0 4px}.x:hover{color:#c5221f}#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:15px;pointer-events:none}
#opts{padding:10px 14px;border-top:1px solid #e1e4ea;font-size:12px;display:grid;gap:6px}
#opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
button{font:inherit;font-size:12px;padding:6px 8px;border:1px solid #c9ced8;background:#fff;border-radius:6px;cursor:pointer}
button:hover{background:#f2f4f8}
#main{flex:1;position:relative;min-width:0}
#c{width:100%;height:100%;display:block}
#info{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border:1px solid #e1e4ea;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;max-width:360px}
#info b{font-size:14px}
#hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:#667085}
#views{position:absolute;right:12px;top:12px;display:flex;gap:4px}
@media (max-width:700px){#app{flex-direction:column}#side{width:100%;height:42%}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="app">
 <div id="side"><h1>FBX 3D 뷰어</h1><label id="drop"><input type="file" id="file" multiple accept=".fbx,.obj,.stl,.glb"><b>FBX 파일 올리기</b><span>클릭하거나 여기로 끌어다 놓기<br>(여러 개 가능 · FBX / OBJ / STL / GLB)</span></label><div id="list"></div>
  <div id="opts">
   <label><input type="checkbox" id="wire"> 와이어프레임</label>
   <label><input type="checkbox" id="edges" checked> 모서리선 표시</label>
   <label><input type="checkbox" id="mono"> 단색 재질(원본 재질 무시)</label>
   <button id="all">전체 나란히 보기</button>
  </div></div>
 <div id="main"><canvas id="c"></canvas><div id="info" style="display:none"></div><div id="empty">왼쪽에서 FBX 파일을 올려주세요</div>
  <div id="views"><button data-v="iso">3D</button><button data-v="front">정면</button><button data-v="top">평면</button><button data-v="right">우측</button></div>
  <div id="hint">왼쪽 드래그: 회전 · 오른쪽 드래그: 이동 · 휠: 확대</div></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const DATA=[];
const wire=document.getElementById('wire'),edges=document.getElementById('edges'),mono=document.getElementById('mono');
const MM=304.8;
const cv=document.getElementById('c'),info=document.getElementById('info');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f5f7);
const cam=new THREE.PerspectiveCamera(40,1,0.01,1000);cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,1.6));
const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(5,-8,10);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,.6);dl2.position.set(-6,6,4);scene.add(dl2);
let grid=null;const root=new THREE.Group();scene.add(root);
const cache={};const monoMat=new THREE.MeshStandardMaterial({color:0xc8ccd4,roughness:.6,metalness:.1,side:THREE.DoubleSide});
function b64ab(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function load(i){
 if(cache[i])return cache[i];
 const d=DATA[i];let r;
 try{const o=d.obj;
  let m=0,t=0;o.traverse(x=>{if(x.isCamera||x.isLight){x.visible=false}if(x.isMesh){m++;const g=x.geometry;t+=(g.index?g.index.count:g.attributes.position.count)/3;
   x.userData.orig=x.material;const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,25),new THREE.LineBasicMaterial({color:0x2b3240,transparent:true,opacity:.55}));e.userData.edge=1;x.add(e);}});
  const bb=new THREE.Box3().setFromObject(o),s=bb.getSize(new THREE.Vector3());
  r={ok:true,obj:o,meshes:m,tris:Math.round(t),size:s};
 }catch(e){r={ok:false,err:String(e.message||e)}}
 return cache[i]=r;
}
function applyOpts(){const w=wire.checked,e=edges.checked,mo=mono.checked;
 root.traverse(x=>{if(x.isMesh){x.material=mo?monoMat:x.userData.orig;(Array.isArray(x.material)?x.material:[x.material]).forEach(m=>{m.wireframe=w;m.side=THREE.DoubleSide})}if(x.userData.edge)x.visible=e})}
function fit(view='iso'){const bb=new THREE.Box3().setFromObject(root);if(bb.isEmpty())return;
 const c=bb.getCenter(new THREE.Vector3()),r=bb.getSize(new THREE.Vector3()).length()/2;
 const dir={iso:[1,-1.3,.9],front:[0,-1,0],top:[0,-0.001,1],right:[1,0,0]}[view];
 const v=new THREE.Vector3(...dir).normalize().multiplyScalar(r/Math.sin(THREE.MathUtils.degToRad(20))*1.05);
 cam.position.copy(c).add(v);cam.near=r/100;cam.far=r*100;cam.updateProjectionMatrix();ctl.target.copy(c);ctl.update();
 if(grid)scene.remove(grid);const gs=Math.max(r*4,1);grid=new THREE.GridHelper(gs,20,0xb5bac4,0xdde0e6);grid.rotation.x=Math.PI/2;grid.position.set(c.x,c.y,bb.min.z-0.001);scene.add(grid)}
const fmt=s=>[s.x,s.y,s.z].map(v=>Math.round(v*MM)).join(' × ')+' mm';
function show(i){root.clear();document.querySelectorAll('.it').forEach((el,k)=>el.classList.toggle('on',k===i));
 const d=DATA[i],r=cache[i];
 if(!r.ok){info.innerHTML=`<b>${d.name}</b><br><span class="er">불러오기 실패: ${r.err}</span>`;return}
 root.add(r.obj);applyOpts();fit();
 info.innerHTML=`<b>${d.name}</b><br>FBX 외형(W×D×H): <b>${fmt(r.size)}</b><br>메쉬 ${r.meshes}개 · 삼각형 ${r.tris.toLocaleString()}개`}
function showAll(){root.clear();document.querySelectorAll('.it').forEach(el=>el.classList.remove('on'));let x=0,ok=0;
 DATA.forEach((d,i)=>{const r=cache[i];if(!r||!r.ok)return;ok++;const g=new THREE.Group();g.add(r.obj);const bb=new THREE.Box3().setFromObject(r.obj);
  g.position.set(x-bb.min.x,-(bb.min.y+bb.max.y)/2,-bb.min.z);x+=(bb.max.x-bb.min.x)+1.0;root.add(g)});
 applyOpts();fit();info.innerHTML=`<b>전체 ${ok}/${DATA.length}개 표시</b><br>실제 크기 비율 그대로 나란히 배치`}
const list=document.getElementById('list'),empty=document.getElementById('empty');
function unitScale(ext){return ext==='fbx'?1:(1/304.8)} // FBX(Revit)=ft, 그 외 mm 가정
async function parse(file){const ext=file.name.split('.').pop().toLowerCase(),buf=await file.arrayBuffer();
 if(ext==='fbx')return new FBXLoader().parse(buf,'');
 if(ext==='obj'){const o=new OBJLoader().parse(new TextDecoder().decode(buf));o.scale.setScalar(unitScale(ext));return o}
 if(ext==='stl'){const g=new STLLoader().parse(buf);const o=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xc8ccd4}));o.scale.setScalar(unitScale(ext));return o}
 if(ext==='glb'){const r=await new Promise((a,b)=>new GLTFLoader().parse(buf,'',a,b));const o=r.scene;o.rotation.x=Math.PI/2;o.scale.setScalar(1/0.3048);return o}
 throw new Error('지원하지 않는 형식: .'+ext)}
function renderList(){list.innerHTML='';DATA.forEach((d,i)=>{const el=document.createElement('div');el.className='it';
 const r=d.res;el.innerHTML=`<span class="x" title="목록에서 빼기">✕</span><b>${i+1}. ${d.name}</b><small>${(d.size/1024).toFixed(0)} KB</small><div class="st ${r.ok?'ok':'er'}">${r.ok?`✔ 정상 · ${fmt(r.size)}`:`✖ 실패: ${r.err}`}</div>`;
 el.onclick=()=>show(i);el.querySelector('.x').onclick=e=>{e.stopPropagation();DATA.splice(i,1);Object.keys(cache).forEach(k=>delete cache[k]);DATA.forEach((d,k)=>cache[k]=d.res);renderList();DATA.length?show(0):(root.clear(),info.style.display='none',empty.style.display='flex')};list.appendChild(el)});
 if(DATA.length>1&&!document.getElementById('all').dataset.on){}}
async function addFiles(files){const start=DATA.length;
 for(const f of files){const d={name:f.name,size:f.size};
  try{d.obj=await parse(f)}catch(e){d.err=String(e.message||e)}
  DATA.push(d);const i=DATA.length-1;
  if(d.obj){delete cache[i];d.res=load(i)}else d.res=cache[i]={ok:false,err:d.err}}
 renderList();empty.style.display='none';info.style.display='block';
 if(DATA.length>start)show(start)}
const fileIn=document.getElementById('file'),drop=document.getElementById('drop');
fileIn.onchange=()=>{addFiles([...fileIn.files]);fileIn.value=''};
['dragover','dragenter'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
addEventListener('drop',e=>{if(e.dataTransfer?.files?.length)addFiles([...e.dataTransfer.files])});
[wire,edges,mono].forEach(e=>e.onchange=applyOpts);
document.getElementById('all').onclick=()=>{if(DATA.length)showAll()};
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>fit(b.dataset.v));
function resize(){const p=cv.parentElement;R.setSize(p.clientWidth,p.clientHeight,false);cam.aspect=p.clientWidth/p.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam)})();
</script></body></html>
